<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mask Builder</title>
<!--
  Công cụ nội bộ: tạo mask vùng phối màu cho Xưởng Phối Màu (js/main.js → craftPhotoBases).

  Mỗi sản phẩm có tối đa 3 vùng, ghi vào 1 file PNG: kênh R = vùng 1, G = vùng 2, B = vùng 3
  (giá trị 0–255 = độ phủ, viền đã làm mềm). File lưu ở img/masks/<photo>.png.

  Cách dùng:
    1. Ở thư mục gốc repo chạy:   node tools/mask-save-server.js
    2. Mở http://localhost:8766/tools/mask-builder.html, chọn sản phẩm, chỉnh seeds/tol trong MASK_CONFIG,
       xem overlay rồi bấm "Lưu mask" (ghi đè img/masks/<photo>.png).
  Mask PNG cũng có thể sửa tay trong Photopea/Photoshop (tô trắng/đen trên từng kênh).

  Tham số mỗi vùng:
    seeds : điểm mẫu [x,y] theo pixel ảnh gốc 800x800
    mode  : 'flood' = loang từ seed theo màu liền kề; 'global' = mọi pixel giống màu seed trong rect
    tol   : ngưỡng khác màu (CIELAB, a/b + L*lw)
    lw    : trọng số độ sáng L (mặc định 0.35; tăng khi cần tách nền trắng/xám)
    rect  : [x0,y0,x1,y1] giới hạn vùng tìm
    ellipse: [cx,cy,rx,ry] giới hạn thêm theo hình elip (vd. nón tròn)
    close : bán kính đóng lỗ (mũi móc tối), mặc định 3
    minus : danh sách id vùng khác sẽ bị trừ ra khỏi vùng này
    extra : danh sách cấu hình phụ (cùng tham số như trên) được gộp thêm vào vùng này, vd. quai túi
-->
<style>
  body { font-family: system-ui, sans-serif; background:#F6F2EA; color:#1E2024; margin:0; padding:16px; }
  canvas { width: 520px; max-width: 100%; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
  .row { display:flex; gap:16px; flex-wrap:wrap; }
  button, select { font: inherit; padding: 6px 10px; }
  pre { font-size: 12px; background:#fff; padding:8px; border-radius:8px; max-width:520px; overflow:auto; }
</style>
</head>
<body>
<h3>Mask Builder — vùng phối màu</h3>
<div class="row">
  <div><canvas id="cv"></canvas></div>
  <div>
    <select id="sel"></select>
    <button id="save">Lưu mask</button>
    <pre id="log"></pre>
  </div>
</div>
<script>
const MASK_CONFIG = {
  'len-12-tui-hoa-dao': [
    { id: 'body', mode: 'flood', seeds: [[126,421],[695,526],[253,63],[480,600]], tol: 10, lw: 0.6, rect: [20,0,740,660],
      extra: [{ mode: 'global', seeds: [[253,63],[480,60]], tol: 12, lw: 0.3, rect: [215,0,525,135] }] },
    { id: 'blossom', mode: 'global', seeds: [[516,320]], tol: 22, rect: [190,100,660,510] },
  ],
  'len-13-tui-tim-no-hong': [
    { id: 'body', mode: 'flood', seeds: [[587,693],[700,640],[480,740]], tol: 18, rect: [400,520,800,800] },
    { id: 'bow', mode: 'flood', seeds: [[600,360],[690,350],[500,350],[445,470],[760,470]], tol: 18, rect: [400,290,800,560], minus: ['body'] },
  ],
  'len-15-tui-hong-soc-charm': [
    { id: 'body', mode: 'flood', seeds: [[267,453],[267,573],[267,720],[560,453],[560,573],[560,720]], tol: 14, rect: [60,250,740,800] },
  ],
  'len-11-tui-huong-duong': [
    { id: 'yarn', mode: 'global', seeds: [[421,316],[480,100]], tol: 9, lw: 0.4, rect: [84,0,740,800] },
    { id: 'petal', mode: 'global', seeds: [[200,400],[160,442]], tol: 20, rect: [84,290,740,800] },
  ],
  'len-09-tui-meo-cam': [
    { id: 'body', mode: 'flood', seeds: [[316,210],[589,189],[300,330],[640,330]], tol: 12, rect: [220,70,780,420], minus: ['face'] },
    { id: 'face', mode: 'flood', seeds: [[421,295],[380,330],[460,330]], tol: 10, lw: 0.6, rect: [280,170,560,400] },
  ],
  'len-02-set-mu-tui-vang': [
    { id: 'hat', mode: 'flood', seeds: [[358,210],[300,300],[440,300],[354,200],[474,316],[250,330]], tol: 18, rect: [180,120,520,450], ellipse: [354,290,162,156] },
    { id: 'bag', mode: 'flood', seeds: [[379,568],[260,600],[500,600],[300,445],[470,445],[380,450]], tol: 14, rect: [186,430,580,730], minus: ['hat'] },
  ],
  // len-18-bup-be-toc-hong (búp bê): tóc len hồng và bàn tay cầm búp bê trùng màu (CIELAB gần như nhau),
  // nên không tách được bằng màu. Cần tách bằng AI (SAM 2) hoặc vẽ mask tay rồi lưu vào img/masks/.
};

const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
const log = m => document.getElementById('log').textContent = m;
let W, H, lab, current, masks;
const COLORS = [[255,0,80],[0,200,255],[255,220,0]];

function s2l(c){ c/=255; return c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
function f(t){ return t>0.008856? Math.cbrt(t) : 7.787*t+16/116; }
function rgb2lab(r,g,b){ r=s2l(r); g=s2l(g); b=s2l(b);
  const x=(r*0.4124+g*0.3576+b*0.1805)/0.95047, y=r*0.2126+g*0.7152+b*0.0722, z=(r*0.0193+g*0.1192+b*0.9505)/1.08883;
  const fx=f(x), fy=f(y), fz=f(z); return [116*fy-16, 500*(fx-fy), 200*(fy-fz)]; }

function morph(src,r,dil){ // separable square morphology
  const tmp=new Uint8Array(W*H), o=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let v=dil?0:1; for(let d=-r;d<=r;d++){ const xx=Math.min(W-1,Math.max(0,x+d)); const s=src[y*W+xx]; if(dil?s:!s){v=dil?1:0;break;} } tmp[y*W+x]=v; }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let v=dil?0:1; for(let d=-r;d<=r;d++){ const yy=Math.min(H-1,Math.max(0,y+d)); const s=tmp[yy*W+x]; if(dil?s:!s){v=dil?1:0;break;} } o[y*W+x]=v; }
  return o;
}
function blur(src,r){ // separable box blur → Float32 0..1
  const tmp=new Float32Array(W*H), o=new Float32Array(W*H), n=2*r+1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let s=0; for(let d=-r;d<=r;d++) s+=src[y*W+Math.min(W-1,Math.max(0,x+d))]; tmp[y*W+x]=s/n; }
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){ let s=0; for(let d=-r;d<=r;d++) s+=tmp[Math.min(H-1,Math.max(0,y+d))*W+x]; o[y*W+x]=s/n; }
  return o;
}
function refAt([sx,sy]){ let l=0,a=0,b=0,n=0;
  for(let y=sy-3;y<=sy+3;y++)for(let x=sx-3;x<=sx+3;x++){ const q=(y*W+x)*3; l+=lab[q]; a+=lab[q+1]; b+=lab[q+2]; n++; }
  return [l/n,a/n,b/n]; }

function buildZone(z){
  const [x0,y0,x1,y1] = z.rect || [0,0,W,H], lw = z.lw ?? 0.35, tol = z.tol;
  const refs = z.seeds.map(refAt);
  const near = i => { const q=i*3; for(const r of refs){ const dl=(lab[q]-r[0])*lw, da=lab[q+1]-r[1], db=lab[q+2]-r[2]; if(dl*dl+da*da+db*db<=tol*tol) return true; } return false; };
  const el = z.ellipse;
  const inRect = i => { const x=i%W, y=(i/W)|0; if(!(x>=x0&&x<x1&&y>=y0&&y<y1)) return false;
    if (el) { const dx=(x-el[0])/el[2], dy=(y-el[1])/el[3]; if (dx*dx+dy*dy>1) return false; } return true; };
  const hard = new Uint8Array(W*H);
  if (z.mode === 'global') {
    for (let i=0;i<W*H;i++) if (inRect(i) && near(i)) hard[i]=1;
  } else {
    const stack = z.seeds.map(([x,y])=>y*W+x);
    while (stack.length){ const i=stack.pop(); if(hard[i]||!inRect(i)||!near(i)) continue; hard[i]=1;
      const x=i%W; if(x>0)stack.push(i-1); if(x<W-1)stack.push(i+1); if(i>=W)stack.push(i-W); if(i<W*(H-1))stack.push(i+W); }
  }
  const r = z.close ?? 3;
  let m = morph(morph(hard,r,true),r,false);
  if (z.mode === 'global') m = morph(morph(m,1,false),1,true); // remove specks
  // clip to rect after closing
  for (let i=0;i<W*H;i++) if(!inRect(i)) m[i]=0;
  return m;
}

function build(name){
  current = name;
  const img = new Image();
  img.onload = () => {
    W = cv.width = img.naturalWidth; H = cv.height = img.naturalHeight;
    ctx.drawImage(img,0,0);
    const d = ctx.getImageData(0,0,W,H).data;
    lab = new Float32Array(W*H*3);
    for (let p=0,q=0;p<d.length;p+=4,q+=3){ const l=rgb2lab(d[p],d[p+1],d[p+2]); lab[q]=l[0]; lab[q+1]=l[1]; lab[q+2]=l[2]; }
    const t0 = performance.now();
    const hardById = {};
    for (const z of MASK_CONFIG[name]) {
      const m = buildZone(z);
      for (const ex of (z.extra||[])) { const e = buildZone(ex); for (let i=0;i<W*H;i++) if (e[i]) m[i]=1; }
      hardById[z.id] = m;
    }
    for (const z of MASK_CONFIG[name]) for (const o of (z.minus||[])) { const a=hardById[z.id], b=hardById[o]; for(let i=0;i<W*H;i++) if(b[i]) a[i]=0; }
    masks = MASK_CONFIG[name].map(z => blur(hardById[z.id], 2));
    // overlay preview
    const id = ctx.getImageData(0,0,W,H), o = id.data;
    masks.forEach((m,k)=>{ const c=COLORS[k]; for(let i=0;i<W*H;i++){ const a=m[i]*0.55; if(a>0){ const p=i*4; o[p]=o[p]*(1-a)+c[0]*a; o[p+1]=o[p+1]*(1-a)+c[1]*a; o[p+2]=o[p+2]*(1-a)+c[2]*a; } } });
    ctx.putImageData(id,0,0);
    ctx.fillStyle = '#fff'; MASK_CONFIG[name].forEach(z => z.seeds.forEach(([x,y]) => { ctx.beginPath(); ctx.arc(x,y,5,0,7); ctx.fill(); }));
    log(name + '\n' + MASK_CONFIG[name].map((z,k)=>`${z.id}: ${(masks[k].reduce((s,v)=>s+(v>0.5),0)/(W*H)*100).toFixed(1)}%`).join('\n') + `\n${(performance.now()-t0)|0} ms`);
  };
  img.src = `../img/products/${name}.jpg`;
}

function maskPngBlob(){
  const c = document.createElement('canvas'); c.width=W; c.height=H;
  const x = c.getContext('2d'), id = x.createImageData(W,H), o = id.data;
  for (let i=0;i<W*H;i++){ const p=i*4; o[p]=Math.round((masks[0]?.[i]||0)*255); o[p+1]=Math.round((masks[1]?.[i]||0)*255); o[p+2]=Math.round((masks[2]?.[i]||0)*255); o[p+3]=255; }
  x.putImageData(id,0,0);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
async function save(name){
  const blob = await maskPngBlob();
  const res = await fetch(`/__save-mask?name=${encodeURIComponent(name)}`, { method:'POST', body: blob });
  return res.status + ' ' + await res.text();
}

const sel = document.getElementById('sel');
Object.keys(MASK_CONFIG).forEach(k => sel.add(new Option(k,k)));
sel.onchange = () => build(sel.value);
document.getElementById('save').onclick = async () => log(await save(current));
build(sel.value);
</script>
</body>
</html>
